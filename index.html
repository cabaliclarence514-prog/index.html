<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our Album</title>
<style>
:root{--bg:#0a0720;--ink:#f3eeff;--mute:#a9a1d0;--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.15);--acc:#9b7bff;--acc2:#5ee0ff;--pink:#ff7ad9}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(ellipse at 50% -10%,#2a1a63 0,transparent 60%),var(--bg);position:relative;overflow-x:hidden}
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.aurora i{position:absolute;width:55vmax;height:55vmax;border-radius:50%;filter:blur(90px);opacity:.38;animation:drift 22s ease-in-out infinite alternate}
.aurora i:nth-child(1){background:#7b4dff;top:-20vmax;left:-15vmax}
.aurora i:nth-child(2){background:#17b8e6;bottom:-25vmax;right:-15vmax;animation-delay:-8s}
.aurora i:nth-child(3){background:#ff4fc3;width:35vmax;height:35vmax;top:35%;left:55%;opacity:.22;animation-delay:-14s}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}
.stars{position:fixed;inset:0;z-index:0;pointer-events:none;
background-image:radial-gradient(1.5px 1.5px at 12% 20%,#fff,transparent),radial-gradient(1px 1px at 30% 70%,#fff,transparent),radial-gradient(1.5px 1.5px at 55% 15%,#cfe,transparent),radial-gradient(1px 1px at 75% 55%,#fff,transparent),radial-gradient(2px 2px at 88% 30%,#fdf,transparent),radial-gradient(1px 1px at 42% 90%,#fff,transparent),radial-gradient(1.5px 1.5px at 65% 82%,#fff,transparent),radial-gradient(1px 1px at 5% 60%,#fff,transparent);
background-size:420px 420px;animation:twinkle 5s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.35}to{opacity:.95}}
header,nav,main{position:relative;z-index:1}
header{padding:56px 20px 6px;text-align:center}
h1{margin:0;font:italic 400 clamp(2.4rem,7vw,4rem)/1.1 Georgia,"Times New Roman",serif;letter-spacing:-.01em;background:linear-gradient(100deg,#fff 10%,#c9b8ff 40%,var(--acc2) 65%,var(--pink) 90%);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 8s linear infinite;filter:drop-shadow(0 0 22px rgba(155,123,255,.5))}
@keyframes shine{to{background-position:200% center}}
header p{margin:10px 0 0;color:var(--mute)}
nav{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:26px 20px}
nav button{font:inherit;padding:10px 22px;border:1px solid var(--line);background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:var(--ink);border-radius:999px;cursor:pointer;transition:transform .2s,box-shadow .2s,background .2s}
nav button:hover{transform:translateY(-2px)}
nav button[aria-selected=true]{background:linear-gradient(120deg,var(--acc),#6a8dff 55%,var(--acc2));border-color:transparent;color:#0a0720;font-weight:600;box-shadow:0 0 26px rgba(130,120,255,.6)}
nav button span{opacity:.75;margin-left:8px;font-size:.82em}
:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
main{max-width:1100px;margin:0 auto;padding:0 20px 70px}
.up{display:flex;gap:12px;flex-wrap:wrap;align-items:center;background:var(--card);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:30px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.up input[type=text]{flex:1 1 220px;font:inherit;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:rgba(10,7,32,.55);color:var(--ink)}
.up input::placeholder{color:var(--mute)}
.up input[type=file]{flex:1 1 200px;font:inherit;color:var(--mute)}
.up input[type=file]::file-selector-button{font:inherit;margin-right:12px;padding:9px 16px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.1);color:var(--ink);cursor:pointer}
.btn{font:inherit;font-weight:600;padding:11px 22px;border:0;border-radius:12px;background:linear-gradient(120deg,var(--pink),var(--acc) 60%,var(--acc2));color:#0a0720;cursor:pointer;box-shadow:0 0 22px rgba(255,122,217,.35);transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 0 30px rgba(155,123,255,.7)}
.btn:disabled{opacity:.5;cursor:wait}
#msg{width:100%;margin:0;font-size:.9rem;color:var(--mute)}
#grid{columns:3 260px;column-gap:20px}
figure{margin:0 0 20px;break-inside:avoid;background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 12px 36px rgba(0,0,0,.4);transition:transform .3s,box-shadow .3s,border-color .3s}
figure:hover{transform:translateY(-5px);border-color:rgba(155,123,255,.7);box-shadow:0 18px 50px rgba(120,90,255,.35)}
figure img,figure video{display:block;width:100%;background:#000}
figcaption{padding:14px 16px}
.cap{margin:0 0 10px;outline:none;border-radius:6px;min-height:1.5em}
.cap:focus{background:rgba(155,123,255,.2)}
.meta{display:flex;justify-content:space-between;font-size:.82rem;color:var(--mute)}
.meta button{font:inherit;border:0;background:none;color:var(--mute);cursor:pointer;text-decoration:underline}
.meta button:hover{color:var(--pink)}
.empty{text-align:center;color:var(--mute);padding:60px 16px;border:1.5px dashed rgba(255,255,255,.25);border-radius:20px;background:rgba(255,255,255,.03)}
h1{cursor:default;user-select:none;-webkit-user-select:none}
dialog{width:min(92vw,440px);padding:26px;border:1px solid var(--line);border-radius:22px;background:rgba(24,16,60,.82);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);color:var(--ink);box-shadow:0 0 60px rgba(120,90,255,.45)}
dialog::backdrop{background:rgba(5,3,20,.65);backdrop-filter:blur(4px)}
dialog h2{margin:0 0 16px;font:italic 400 1.6rem Georgia,serif}
dialog label{display:block;margin:0 0 14px;color:var(--mute);font-size:.9rem}
dialog input,dialog select{display:block;width:100%;margin-top:6px;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:rgba(10,7,32,.6);color:var(--ink)}
dialog input[type=file]{padding:8px}
dialog select option{background:#1a1240}
dialog .row{display:flex;gap:10px;margin:0 0 14px;align-items:center}
dialog .row input{margin:0;flex:1}
dialog .row:last-child{justify-content:flex-end;margin:6px 0 0}
dialog details{margin:0 0 10px;color:var(--mute);font-size:.9rem}
dialog summary{cursor:pointer;margin-bottom:10px}
.ghost{font:inherit;padding:10px 16px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.08);color:var(--ink);cursor:pointer;white-space:nowrap}
.err{color:var(--pink);margin:8px 0 0;min-height:1.4em}
.note{margin:0 0 10px;color:var(--mute);font-size:.9rem;min-height:1.3em}

body.friends #gbg{opacity:1}
body.friends .aurora,body.friends .stars{opacity:0}
[hidden]{display:none!important}
.top{position:relative;z-index:3;display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap;max-width:1100px;margin:0 auto;padding:16px 20px 0}
.srch{position:relative;flex:1 1 240px;max-width:360px}
.srch input{width:100%;font:inherit;padding:10px 16px;border:1px solid var(--line);border-radius:999px;background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:var(--ink)}
.srch input::placeholder{color:var(--mute)}
.res{position:absolute;top:calc(100% + 6px);left:0;right:0;background:rgba(24,16,60,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:16px;padding:6px;box-shadow:0 14px 40px rgba(0,0,0,.5)}
.res button{display:block;width:100%;text-align:left;font:inherit;padding:9px 12px;border:0;border-radius:10px;background:none;color:var(--ink);cursor:pointer}
.res button:hover,.res button:focus-visible{background:rgba(155,123,255,.25)}
.res p{margin:0;padding:9px 12px;color:var(--mute)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="aurora"><i></i><i></i><i></i></div><div class="stars"></div><div id="pbg"></div><div id="fbg"></div><div id="gbg"></div>
<div class="top">
  <div class="srch"><input type="search" id="q" placeholder="Search accounts" aria-label="Search accounts" autocomplete="off"><div class="res" id="res" hidden></div></div>
  <div class="acts" id="acts"></div>
</div>
<header>
  <h1 id="title">Our Album</h1>
  <p id="sub">Every moment, kept in its own little universe.</p>
</header>
<nav role="tablist" id="tabs"></nav>
<main>
  <section id="grid" aria-live="polite"></section>
</main>

<dialog id="auth">
  <form id="authForm">
    <h2 id="authTitle">Sign in</h2>
    <label id="hWrap" hidden>Username<input type="text" id="handle" placeholder="3-20 letters, numbers or _" maxlength="20" autocomplete="username"></label>
    <label>Email<input type="email" id="email" required autocomplete="email"></label>
    <label>Password<input type="password" id="apw" required minlength="6" autocomplete="current-password"></label>
    <p class="err" id="authErr"></p>
    <div class="row"><button type="button" class="ghost" id="swap"></button></div>
    <div class="row"><button type="button" class="ghost" data-close>Cancel</button><button class="btn" id="authGo">Sign in</button></div>
  </form>
</dialog>

<dialog id="own">
  <form id="ownForm">
    <h2>Enter password</h2>
    <input type="password" id="ownPw" placeholder="Password" autocomplete="current-password" aria-label="Password" required>
    <p class="err" id="ownErr"></p>
    <div class="row"><button type="button" class="ghost" data-close>Cancel</button><button class="btn" id="ownGo">Unlock</button></div>
  </form>
</dialog>

<dialog id="up">
  <form id="upForm">
    <h2>Add to the album</h2>
    <label>Category<select id="cat"></select></label>
    <div class="row">
      <input type="text" id="newCat" placeholder="New category name" maxlength="30" aria-label="New category name">
      <button type="button" class="ghost" id="addCat">Add category</button>
    </div>
    <label>Photos<input type="file" id="file" accept="image/*" multiple required></label>
    <label>Caption<input type="text" id="caption" placeholder="Write a caption" maxlength="160"></label>
    <p class="note" id="msg"></p>
    <div class="row"><button type="button" class="ghost" data-close>Close</button><button class="btn" id="add">Upload</button></div>
  </form>
</dialog>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* SETUP
   1. Firebase console: turn on Authentication > Email/Password and Firestore. Storage is not needed: photos are saved inside Firestore.
   2. Paste your web config below.
   3. Firebase console > Authentication > Users > Add user: use the OWNER_EMAIL below and the password you want for uploads.
      Then click the page title 5 times on the site, enter that password, and the upload window opens.
      Your album is the default page for everyone, unless they search for or open another account.
   4. Firestore rules (replace clarencecabali.socmed@gmail.com with your OWNER_EMAIL; keep OWNER_HANDLE as "owner" or change 'owner' here too):
      rules_version='2'; service cloud.firestore { match /databases/{d}/documents {
        match /users/{uid} { allow read: if true;
          allow write: if request.auth.uid==uid && (request.resource.data.handleLower!='owner' || request.auth.token.email=='clarencecabali.socmed@gmail.com'); }
        match /handles/{h} { allow read: if true;
          allow create: if request.auth!=null && request.resource.data.uid==request.auth.uid && (h!='owner' || request.auth.token.email=='clarencecabali.socmed@gmail.com'); }
        match /album/{id} { allow read: if true;
          allow create: if request.auth.uid==request.resource.data.uid && request.resource.data.url.size()<900000;
          allow update, delete: if request.auth.uid==resource.data.uid; } } }
   5. Photos only (about 1000 px wide); videos are not supported without Firebase Storage.
   Links: yourpage.html opens the OWNER_HANDLE album; yourpage.html#name opens another account. */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyA4b7S2ezd6wQ6Zur84_E8wzCh6oCmi_Po",
  authDomain: "album-ph.firebaseapp.com",
  projectId: "album-ph",
  storageBucket: "album-ph.firebasestorage.app",
  messagingSenderId: "603100127952",
  appId: "1:603100127952:web:d90a9edab1ec50477534d5"
};
const OWNER_HANDLE = "owner";
const OWNER_EMAIL = "clarencecabali.socmed@gmail.com"; // your owner login email (create it in Firebase Authentication > Users)

const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const DEFAULT_CATS = ["Partner","Family","Friends","Travel"];
let TABS = DEFAULT_CATS.slice(), tab = TABS[0], view = null, me = null;
document.querySelectorAll("[data-close]").forEach(b => b.onclick = () => b.closest("dialog").close());

if (!FIREBASE_CONFIG) {
  $("grid").innerHTML = '<div class="empty">Add your Firebase config in album.html to turn on accounts and uploads.</div>';
} else start();

function start(){
  firebase.initializeApp(FIREBASE_CONFIG);
  const auth = firebase.auth(), db = firebase.firestore();
  const friendly = e => ({"auth/invalid-credential":"Wrong email or password.","auth/email-already-in-use":"That email already has an account.","auth/weak-password":"Use at least 6 characters.","auth/invalid-email":"Enter a valid email.","auth/user-not-found":"The owner login has not been created in Firebase Authentication yet."}[e.code] || e.message);

  /* ---- viewing an album ---- */
  async function getUser(handle){
    const h = await db.collection("handles").doc(handle.toLowerCase()).get();
    if (!h.exists) return null;
    const u = await db.collection("users").doc(h.data().uid).get();
    return u.exists ? {uid:u.id, ...u.data()} : null;
  }
  async function route(){
    const p = new URLSearchParams(location.search);
    const handle = decodeURIComponent(location.hash.slice(1)) || p.get("u") || OWNER_HANDLE;
    let u = await getUser(handle);
    if (!u && handle.toLowerCase() === OWNER_HANDLE.toLowerCase()) u = {uid:null, handle:OWNER_HANDLE, cats:DEFAULT_CATS.slice()};
    if (!u){ view = null; TABS = []; drawTabs(); $("sub").textContent = ""; $("grid").innerHTML = `<div class="empty">No account named ${esc(handle)}.</div>`; return; }
    view = u; TABS = u.cats && u.cats.length ? u.cats : DEFAULT_CATS.slice(); tab = TABS[0]; await loadItems();
    $("sub").textContent = u.handle.toLowerCase() === OWNER_HANDLE.toLowerCase() ? "Every moment, kept in its own little universe." : `@${u.handle}'s album`;
    drawTabs(); render();
  }
  async function loadItems(){
    if (!view.uid){ view.items = []; return; }
    const s = await db.collection("album").where("uid","==",view.uid).get();
    view.items = s.docs.map(d => d.data()).sort((a,b) => b.date - a.date);
  }
  const list = t => view.items.filter(i => i.tab === t);
  function drawTabs(){
    document.body.classList.toggle("partner", tab === "Partner");
    document.body.classList.toggle("family", tab === "Family");
    document.body.classList.toggle("friends", tab === "Friends");
    $("tabs").innerHTML = TABS.map(t => `<button role="tab" data-tab="${esc(t)}" aria-selected="${t===tab}">${esc(t)}<span>0</span></button>`).join("");
  }
  $("tabs").onclick = e => { const b = e.target.closest("button"); if(b){ tab = b.dataset.tab; drawTabs(); render(); } };
  async function render(){
    if (!view) return;
    const items = await list(tab), g = $("grid");
    g.innerHTML = "";
    if (!items.length) g.innerHTML = `<div class="empty">Nothing in ${esc(tab)} yet.</div>`;
    items.forEach(i => {
      const f = document.createElement("figure");
      f.innerHTML = i.type.startsWith("video") ? `<video src="${esc(i.url)}" controls preload="metadata"></video>` : `<img src="${esc(i.url)}" alt="" loading="lazy">`;
      if (i.caption){ const c = document.createElement("figcaption"); c.textContent = i.caption; f.appendChild(c); }
      g.appendChild(f);
    });
    for (const b of $("tabs").querySelectorAll("button")) b.querySelector("span").textContent = (await list(b.dataset.tab)).length;
  }
  window.onhashchange = route;

  /* ---- search ---- */
  let st;
  $("q").oninput = () => { clearTimeout(st); st = setTimeout(async () => {
    const q = $("q").value.trim().toLowerCase(), r = $("res");
    if (!q){ r.hidden = true; return; }
    const s = await db.collection("users").where("handleLower",">=",q).where("handleLower","<",q+"\uf8ff").limit(8).get();
    r.innerHTML = s.empty ? "<p>No accounts found.</p>" : s.docs.map(d => `<button data-h="${esc(d.data().handle)}">@${esc(d.data().handle)}</button>`).join("");
    r.hidden = false;
  }, 250); };
  $("res").onclick = e => { const b = e.target.closest("button"); if(!b) return;
    $("res").hidden = true; $("q").value = ""; location.hash = b.dataset.h; };
  document.addEventListener("click", e => { if(!e.target.closest(".srch")) $("res").hidden = true; });

  /* ---- accounts ---- */
  async function loadMe(uid){
    const d = await db.collection("users").doc(uid).get();
    me = d.exists ? {uid, ...d.data()} : null; paintAuth();
  }
  function paintAuth(){
    $("acts").innerHTML = me
      ? `<button class="ghost" data-a="mine">@${esc(me.handle)}</button><button class="btn" data-a="add">Add</button><button class="ghost" data-a="out">Sign out</button>`
      : `<button class="btn" data-a="in">Sign in</button>`;
  }
  auth.onAuthStateChanged(u => u ? loadMe(u.uid) : (me = null, paintAuth()));
  $("acts").onclick = e => { const a = e.target.closest("button")?.dataset.a;
    if (a === "in") openAuth(); else if (a === "add") openUpload();
    else if (a === "mine") location.hash = me.handle; else if (a === "out") auth.signOut(); };

  let mode = "in";
  function setMode(m){
    mode = m; $("hWrap").hidden = m === "in"; $("authErr").textContent = "";
    $("authTitle").textContent = m === "in" ? "Sign in" : "Create account";
    $("authGo").textContent = m === "in" ? "Sign in" : "Create account";
    $("swap").textContent = m === "in" ? "New here? Create an account" : "Have an account? Sign in";
    $("apw").autocomplete = m === "in" ? "current-password" : "new-password";
  }
  function openAuth(){ setMode("in"); $("authForm").reset(); $("auth").showModal(); }
  $("swap").onclick = () => setMode(mode === "in" ? "up" : "in");
  $("authForm").onsubmit = async e => {
    e.preventDefault(); $("authGo").disabled = true; $("authErr").textContent = "";
    try {
      const email = $("email").value.trim(), pw = $("apw").value;
      if (mode === "in") await auth.signInWithEmailAndPassword(email, pw);
      else {
        const handle = $("handle").value.trim();
        if (!/^[A-Za-z0-9_]{3,20}$/.test(handle)) throw new Error("Username: 3-20 letters, numbers or _.");
        if (handle.toLowerCase() === OWNER_HANDLE.toLowerCase()) throw new Error("That username is reserved.");
        const hr = db.collection("handles").doc(handle.toLowerCase());
        if ((await hr.get()).exists) throw new Error("That username is taken.");
        const c = await auth.createUserWithEmailAndPassword(email, pw), uid = c.user.uid;
        try {
          await db.runTransaction(async t => {
            if ((await t.get(hr)).exists) throw new Error("That username is taken.");
            t.set(hr, {uid});
            t.set(db.collection("users").doc(uid), {handle, handleLower:handle.toLowerCase(), cats:DEFAULT_CATS, date:Date.now()});
          });
        } catch(err){ await c.user.delete(); throw err; }
        await loadMe(uid); location.hash = handle;
      }
      $("auth").close();
    } catch(err){ $("authErr").textContent = friendly(err); }
    $("authGo").disabled = false;
  };

  /* ---- shrink a photo so it fits inside a database document ---- */
  function shrink(file){
    return new Promise((res, rej) => {
      const img = new Image(), u = URL.createObjectURL(file);
      img.onerror = () => rej(new Error("Could not read that photo."));
      img.onload = () => {
        let sc = Math.min(1, 1000 / Math.max(img.width, img.height)), q = .8, out;
        for (;;){
          const c = document.createElement("canvas");
          c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
          c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
          out = c.toDataURL("image/jpeg", q);
          if (out.length < 400000 || sc < .2) break;
          q = Math.max(.5, q - .1); sc *= .85;
        }
        URL.revokeObjectURL(u); res(out);
      };
      img.src = u;
    });
  }

  /* ---- upload (your own album only) ---- */
  const fillCats = sel => { $("cat").innerHTML = me.cats.map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join(""); $("cat").value = sel; };
  function openUpload(){ fillCats(view && view.uid === me.uid ? tab : me.cats[0]); $("msg").textContent = ""; $("up").showModal(); }
  $("addCat").onclick = async () => {
    const n = $("newCat").value.trim(); if(!n) return;
    const hit = me.cats.find(t => t.toLowerCase() === n.toLowerCase());
    if (!hit){
      me.cats = [...me.cats, n]; await db.collection("users").doc(me.uid).update({cats:me.cats});
      if (view && view.uid === me.uid){ TABS = me.cats; drawTabs(); render(); }
    }
    fillCats(hit || n); $("newCat").value = ""; $("msg").textContent = hit ? "That category already exists." : `Added "${n}".`;
  };
  $("upForm").onsubmit = async e => {
    e.preventDefault();
    const files = [...$("file").files], cat = $("cat").value; if(!files.length) return;
    $("add").disabled = true; $("msg").textContent = "Uploading…";
    try {
      for (const f of files){
        if (!f.type.startsWith("image/")) throw new Error("Only photos are supported.");
        await db.collection("album").add({uid:me.uid, tab:cat, caption:$("caption").value.trim(), url:await shrink(f), type:"image/jpeg", date:Date.now()});
      }
      $("file").value = ""; $("caption").value = ""; $("up").close();
      if (view && view.uid === me.uid){ tab = cat; await loadItems(); drawTabs(); render(); } else location.hash = me.handle;
    } catch(err){ $("msg").textContent = "Could not upload: " + err.message; }
    $("add").disabled = false;
  };

  $("ownForm").onsubmit = async e => {
    e.preventDefault(); $("ownGo").disabled = true; $("ownErr").textContent = "";
    try {
      const c = await auth.signInWithEmailAndPassword(OWNER_EMAIL, $("ownPw").value), uid = c.user.uid;
      const ref = db.collection("users").doc(uid);
      if (!(await ref.get()).exists){
        const hr = db.collection("handles").doc(OWNER_HANDLE.toLowerCase());
        await db.runTransaction(async t => {
          t.set(hr, {uid});
          t.set(ref, {handle:OWNER_HANDLE, handleLower:OWNER_HANDLE.toLowerCase(), cats:DEFAULT_CATS, date:Date.now()});
        });
      }
      await loadMe(uid); $("own").close();
      if (location.hash) location.hash = ""; else await route();
      openUpload();
    } catch(err){ $("ownErr").textContent = err.code === "auth/invalid-credential" ? "Wrong password. Try again." : friendly(err); }
    $("ownGo").disabled = false;
  };

  /* clicking the title 5 times asks for the owner password (or opens the upload window when already signed in) */
  let clicks = 0, timer;
  $("title").onclick = () => {
    clearTimeout(timer); timer = setTimeout(() => clicks = 0, 2500);
    if (++clicks >= 5){ clicks = 0; if (me) openUpload(); else { $("ownPw").value = ""; $("ownErr").textContent = ""; $("own").showModal(); $("ownPw").focus(); } }
  };
  route();
}
</script>
</body>
